
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>オトクリチェッカー</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f5f5;
  --surface: #fff;
  --text: #202020;
  --muted: #737373;
  --border: #dedede;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151515;
    --surface: #202020;
    --text: #f2f2f2;
    --muted: #a5a5a5;
    --border: #383838;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 18px 14px 36px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
  line-height: 1.5;
}
main { max-width: 680px; margin: auto; }
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 4px 0 18px;
}
h1 { margin: 0; font-size: 20px; }
#status { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
button {
  padding: 8px 13px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
}
.last-played, .stat, .history-section {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
}
.last-played { padding: 14px 15px; margin-bottom: 12px; }
.section-label { color: var(--muted); font-size: 12px; }
.last-played-value {
  margin-top: 3px;
  font-size: 19px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}
.stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}
.stat { min-width: 0; padding: 12px 13px; }
.value {
  margin-top: 3px;
  font-size: clamp(21px, 6vw, 27px);
  font-weight: 650;
  overflow-wrap: anywhere;
}
.history-section { margin-top: 20px; padding: 14px 15px; }
h2 { margin: 0 0 8px; font-size: 15px; }
.history-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px 12px;
  padding: 11px 0;
  border-top: 1px solid var(--border);
  font-size: 13px;
}
.history-row:first-child { border-top: 0; }
.history-detail { margin-top: 3px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.history-result { color: var(--muted); white-space: nowrap; }
.empty { padding: 12px 0; color: var(--muted); font-size: 13px; }
@media (min-width: 520px) {
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>オトクリチェッカー</h1>
      <p id="status">接続準備中...</p>
    </div>
    <button type="button" onclick="loadData()">更新</button>
  </header>

  <section class="last-played">
    <div class="section-label">最終プレイ日時</div>
    <div class="last-played-value" id="lastPlayed">日時データ未登録</div>
  </section>

  <section class="stats">
    <div class="stat"><div class="section-label">総記録数</div><div class="value" id="total">0</div></div>
    <div class="stat"><div class="section-label">勝利数</div><div class="value" id="wins">0</div></div>
    <div class="stat"><div class="section-label">敗北数</div><div class="value" id="losses">0</div></div>
    <div class="stat"><div class="section-label">勝率</div><div class="value" id="rate">0%</div></div>
    <div class="stat"><div class="section-label">Yポイント合計</div><div class="value" id="points">0</div></div>
    <div class="stat"><div class="section-label">Yマネー合計</div><div class="value" id="money">0</div></div>
  </section>

  <section class="history-section">
    <h2>周回履歴</h2>
    <div id="history"><div class="empty">まだ記録がありません</div></div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://frrlztkpsfzqerjetvmy.supabase.co";
const SUPABASE_KEY = "sb_publishable_Dg-xtv361dQHsdTXgsc-_w_Ks8yXR-e";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadData() {
  const status = document.getElementById("status");
  status.textContent = "読み込み中...";

  const { data, error } = await db
    .from("lap records")
    .select("*")
    .order("id", { ascending: false })
    .limit(500);

  if (error) {
    status.textContent = "読み込みエラー: " + error.message;
    return;
  }

  const rows = data || [];

  const wins = rows.filter(x =>
    String(x.result).toLowerCase() === "win" ||
    String(x.result) === "勝利" ||
    String(x.result) === "クリア"
  ).length;

  const losses = rows.filter(x =>
    String(x.result).toLowerCase() === "lose" ||
    String(x.result) === "敗北"
  ).length;

  const sum = key => rows.reduce(
    (total, x) => total + (Number(x[key]) || 0), 0
  );

  document.getElementById("total").textContent = rows.length.toLocaleString("ja-JP");
  document.getElementById("wins").textContent = wins.toLocaleString("ja-JP");
  document.getElementById("losses").textContent = losses.toLocaleString("ja-JP");
  document.getElementById("rate").textContent =
    (wins + losses ? (wins / (wins + losses) * 100).toFixed(1) : "0") + "%";
  document.getElementById("points").textContent = sum("y_points").toLocaleString("ja-JP");
  document.getElementById("money").textContent = sum("y_money").toLocaleString("ja-JP");

  const latestPlayedAt = rows.find(x => x.played_at)?.played_at;
  document.getElementById("lastPlayed").textContent =
    latestPlayedAt ? formatPlayedAt(latestPlayedAt) : "日時データ未登録";

  document.getElementById("history").innerHTML = rows.length
    ? rows.map(x => `
      <article class="history-row">
        <div>
          <div><strong>周回 ${escapeHtml(Number(x.lap_number) || "-")}</strong></div>
          <div class="history-detail">Yポイント ${(Number(x.y_points) || 0).toLocaleString("ja-JP")} ・ Yマネー ${(Number(x.y_money) || 0).toLocaleString("ja-JP")}</div>
          <div class="history-detail">アイテム：${escapeHtml(x.items || "なし")}</div>
        </div>
        <div class="history-result">${escapeHtml(x.result || "-")}</div>
      </article>
    `).join("")
    : '<div class="empty">まだ記録がありません</div>';

  status.textContent = "接続済み";
}

function formatPlayedAt(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return escapeHtml(value);
  return new Intl.DateTimeFormat("ja-JP", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).format(date);
}

function escapeHtml(value) {
  return String(value ?? "-").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[c]);
}

loadData();
</script>
</body>
</html>
